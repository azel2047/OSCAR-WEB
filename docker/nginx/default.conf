# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kompetisioscar.my.id www.kompetisioscar.my.id;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name kompetisioscar.my.id www.kompetisioscar.my.id;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ── Cloudflare Origin Certificate (SSL) ────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # ── SSL Protocols & Ciphers ────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/oscar_access.log;
    error_log  /var/log/nginx/oscar_error.log;

    # ── Health check endpoint ────────────────────────────────────────────────────
    location = /api/health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── API Rate Limiting ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Filament Admin Panel ─────────────────────────────────────────────────────
    location /admin {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Static Files (built Vite assets) ─────────────────────────────────────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Public Storage Files ──────────────────────────────────────────────────────
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Favicon & Robots ──────────────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; expires 1y; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Deny hidden files ──────────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny sensitive directories ─────────────────────────────────────────────────
    location ~ ^/bootstrap/cache {
        deny all;
    }

    # ── React SPA — Catch-all (non-API/admin routes) ───────────────────────────────
    location / {
        limit_req zone=general burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ────────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_hide_header X-Powered-By;
    }
}
