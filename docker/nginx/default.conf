server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/oscar_access.log;
    error_log  /var/log/nginx/oscar_error.log;

    # ── Health check endpoint (bypass rate limiting) ──────────────────────────
    location = /api/health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ── API Rate Limiting ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Filament Admin Panel ──────────────────────────────────────────────────
    location /admin {
        limit_req zone=general burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Static Files (built Vite assets) ─────────────────────────────────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Public Storage Files ──────────────────────────────────────────────────
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Favicon & Robots ──────────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; expires 1y; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Deny hidden files ──────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny sensitive directories ────────────────────────────────────────────
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }

    # ── React SPA — Catch-all (non-API/admin routes) ──────────────────────────
    location / {
        limit_req zone=general burst=100 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_hide_header X-Powered-By;
    }
}
